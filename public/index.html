<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSL WebSocket Test Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }
        #status {
            font-weight: bold;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            background-color: #f0f0f0;
        }
        #controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 8px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
        }
        #log {
            border: 1px solid #ccc;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            background-color: #fafafa;
            font-family: monospace;
        }
        .sent { color: #0066cc; }
        .received { color: #008800; }
        .system { color: #888888; font-style: italic; }
    </style>
</head>
<body>
    <h2>BSL WebSocket Client</h2>
    <div id="status">Status: Connecting...</div>
    <div id="controls">
        <input type="text" id="msgInput" placeholder="Enter message..." disabled />
        <button id="sendBtn" disabled>Send</button>
    </div>
    <div id="log"></div>
    <script>
        const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";
        const wsUrl = wsProtocol + window.location.host;
        const socket = new WebSocket(wsUrl);
        const statusDiv = document.getElementById("status");
        const logDiv = document.getElementById("log");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        let heartbeatTimer = null;

        function appendLog(text, className) {
            const entry = document.createElement("div");
            entry.className = className;
            entry.textContent = text;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        socket.onopen = function() {
            statusDiv.textContent = "Status: Connected to " + wsUrl;
            statusDiv.style.backgroundColor = "#d4edda";
            statusDiv.style.color = "#155724";
            msgInput.disabled = false;
            sendBtn.disabled = false;
            appendLog("[System] Handshake complete. WebSocket ready.", "system");

            // Send a tiny, invisible "heartbeat" every 20 seconds so the
            // connection never sits idle long enough for a proxy/tunnel
            // (like the Codespaces forwarded port) to time it out and
            // silently drop it. The server recognizes "__ping__" and
            // ignores it instead of broadcasting it to everyone.
            heartbeatTimer = setInterval(function() {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send("__ping__");
                }
            }, 20000);
        };

        socket.onmessage = function(event) {
            appendLog("[Server] " + event.data, "received");
        };

        socket.onclose = function(event) {
            if (heartbeatTimer) {
                clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }
            statusDiv.textContent = "Status: Disconnected";
            statusDiv.style.backgroundColor = "#f8d7da";
            statusDiv.style.color = "#721c24";
            msgInput.disabled = true;
            sendBtn.disabled = true;
            appendLog("[System] Connection closed by server.", "system");
        };

        socket.onerror = function(error) {
            appendLog("[Error] WebSocket error occurred.", "system");
        };

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text.length > 0 && socket.readyState === WebSocket.OPEN) {
                socket.send(text);
                appendLog("[Client] " + text, "sent");
                msgInput.value = "";
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
